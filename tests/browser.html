<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Comedy-Connections browser checks</title>
<p id="result">Running browser checks…</p>
<pre id="log"></pre>
<iframe id="app" src="../index.html" title="Application under test" style="width:1280px;height:720px;border:0"></iframe>
<script>
const frame = document.getElementById('app');
const result = document.getElementById('result');
const log = document.getElementById('log');
const delay = ms => new Promise(resolve => setTimeout(resolve, ms));
function check(condition, message) {
    if (!condition) throw new Error(message);
}
async function until(condition, message, timeout = 8000) {
    const deadline = performance.now() + timeout;
    while (!condition()) {
        if (performance.now() > deadline) throw new Error(message);
        await delay(25);
    }
}
function passed(message) {
    log.textContent += 'PASS: ' + message + '\n';
}

frame.addEventListener('load', async () => {
    let p;
    try {
        const app = frame.contentWindow;
        const doc = app.document;
        await until(() => {
            p = app.Processing && app.Processing.getInstanceById('ComedyConnections');
            return p && p.getVertexCount() === app.Data.person.length;
        }, 'Application did not load');
        const canvas = doc.getElementById('ComedyConnections');
        const errors = [];
        app.addEventListener('error', event => errors.push(event.message));
        const showIds = new Set(app.Data.show.map(show => show.id));
        const personIds = new Set(app.Data.person.map(person => person.id));
        const showKeys = new Set();
        for (const show of app.Data.show) {
            const key = JSON.stringify([show.type, show.title.trim().toLowerCase(), show.year]);
            check(!showKeys.has(key), 'Duplicate show: ' + show.title + ' (' + show.year + ')');
            showKeys.add(key);
        }
        check(showIds.size === app.Data.show.length, 'Duplicate show ID');
        const creditKeys = new Set();
        for (const credit of app.Data.personToShow) {
            const key = credit.personId + ':' + credit.showId;
            check(showIds.has(credit.showId) && personIds.has(credit.personId), 'Credit refers to a missing show or person');
            check(!creditKeys.has(key), 'Duplicate credit: ' + key);
            creditKeys.add(key);
        }
        const click = id => doc.getElementById(id).click();
        function filter(value) {
            const input = doc.getElementById('filterText');
            input.value = value;
            input.dispatchEvent(new app.Event('input', {bubbles: true}));
        }
        function mouse(type, x, y) {
            const box = canvas.getBoundingClientRect();
            canvas.dispatchEvent(new app.MouseEvent(type, {
                bubbles: true, button: 0, clientX: Math.ceil(box.left + x), clientY: Math.ceil(box.top + y)
            }));
        }
        async function idle() {
            const deadline = performance.now() + 10000;
            while (performance.now() < deadline) {
                const count = p.frameCount;
                await delay(200);
                if (p.frameCount === count) return;
            }
            throw new Error('Drawing did not stop after the graph settled');
        }
        async function wakes(action) {
            const count = p.frameCount;
            action();
            await until(() => p.frameCount > count, 'Drawing did not resume', 1500);
        }
        function finiteGraph() {
            return Array.from({length: p.getVertexCount()}, (_, i) => p.getVertex(i)).every(v =>
                [v.x, v.y, v.newX, v.newY, v.p.position.x, v.p.position.y].every(Number.isFinite));
        }

        mouse('mousemove', 1, 1);
        click('arrangementPhysics');
        for (const [view, count] of [['People', app.Data.person.length], ['Shows', app.Data.show.length]]) {
            click('viewMode' + view);
            for (const layout of ['Random', 'Year', 'Size', 'YearAndSize']) {
                await wakes(() => click('arrangement' + layout));
                await idle();
                check(p.getVertexCount() === count && finiteGraph(), view + ' graph changed');
                const image = canvas.toDataURL();
                const frames = p.frameCount;
                await delay(100);
                check(p.frameCount === frames && canvas.toDataURL() === image, 'Idle frame changed');
                passed(view + ', ' + layout + ': animation settles, then drawing stops');
            }
        }

        // Merged records must render once and retain credits from both old IDs.
        for (const [title, cast] of [
            ['Little Britain', ['Steve Coogan', 'Matt Lucas', 'David Walliams']],
            ['Saxondale', ['Steve Coogan', 'Mark Williams', 'James Bachman', 'Kevin Eldon', 'Matt Berry']]
        ]) {
            filter(title);
            await idle();
            check(p.getVertexCount() === 1 && p.getVertex(0).item.name === title, title + ' did not render as one node');
            const castNames = app.findPersonInShows(title).map(person => person.personName);
            check(cast.every(name => castNames.includes(name)), title + ' lost a connection when its duplicate was merged');
        }
        filter('');
        await idle();
        passed('Show records and credits are unique; merged shows render once and preserve their connections');

        // Three independent pairs make it possible to check the rendered opacity
        // of neighbours and unrelated items without overlapping lines or labels.
        const savedData = app.UsedData;
        const fixture = {
            person: Array.from({length: 6}, (_, i) => ({id: i + 1, name: 'Person ' + (i + 1), dob: 1950 + i * 5})),
            show: Array.from({length: 6}, (_, i) => ({id: i + 1, title: 'Show ' + (i + 1), year: 1980 + i})),
            personToShow: Array.from({length: 6}, (_, i) => [0, 1].map(j => ({personId: i + 1, showId: Math.floor(i / 2) * 2 + j + 1}))).flat()
        };
        const context = canvas.getContext('2d');
        // Warm up pixel reads before the baseline redraw so Chrome does not
        // switch canvas rasterisation halfway through these comparisons.
        for (let i = 0; i < 3; i++) context.getImageData(0, 0, 1, 1);
        const pixel = (x, y) => Array.from(context.getImageData(x, y, 1, 1).data).slice(0, 3);
        const samePixel = (a, b) => a.every((value, i) => value === b[i]);
        const brightness = rgb => rgb.reduce((sum, value) => sum + value, 0);
        function checkDimmed(x, y, original, message) {
            const value = brightness(pixel(x, y));
            check(value > brightness(original) * 0.3 && value < brightness(original) * 0.5, message);
        }
        async function sampleFade(action, x, y) {
            const samples = [brightness(pixel(x, y))];
            const times = [0];
            const start = performance.now();
            action();
            const deadline = start + 250;
            while (performance.now() < deadline) {
                await delay(10);
                samples.push(brightness(pixel(x, y)));
                times.push(performance.now() - start);
            }
            await idle();
            samples.push(brightness(pixel(x, y)));
            times.push(performance.now() - start);
            return {samples, times};
        }
        function checkFade({samples, times}, direction, message) {
            const start = samples[0], end = samples[samples.length - 1];
            check((end - start) * direction > 10, message + ': no opacity change');
            const intermediate = new Set(samples.filter(value => value > Math.min(start, end) + 3 && value < Math.max(start, end) - 3));
            check(intermediate.size >= 3, message + ': opacity changed abruptly');
            check(samples.every((value, i) => i === 0 || (value - samples[i - 1]) * direction >= -2), message + ': opacity flickered');
            const firstChange = samples.findIndex(value => Math.abs(value - start) > 3);
            const settled = samples.findIndex((value, i) => Math.abs(value - end) <= 2 && samples.slice(i).every(next => Math.abs(next - end) <= 2));
            check(times[firstChange] < 80, message + ': hover response was delayed');
            check(times[settled] < 180, message + ': fade took too long to settle');
        }
        function place(index, x, y) {
            const v = p.getVertex(index);
            v.x = v.newX = x;
            v.y = v.newY = y;
            v.p.position.set(x, y, 0);
        }
        for (const view of [0, 1]) {
            app.UsedData = fixture;
            p.setViewMode(view);
            p.resetData();
            p.createGraph();
            p.changeLayoutMode(0);
            [[100, 90], [500, 90], [100, 260], [500, 260], [700, 400], [1100, 400]].forEach(([x, y], i) => place(i, x, y));
            mouse('mousemove', 1, 1);
            await idle();
            const normal = canvas.toDataURL();
            const neighbour = pixel(500, 93);
            const unrelatedNode = pixel(100, 263);
            const unrelatedEdge = pixel(300, 260);
            const relatedEdge = pixel(300, 90);

            checkFade(await sampleFade(() => mouse('mousemove', 300, 90), 100, 263), -1, 'Connection fade-in');
            checkDimmed(100, 263, unrelatedNode, 'Connection hover did not dim unrelated nodes');
            checkDimmed(300, 260, unrelatedEdge, 'Connection hover did not dim other connections');
            check(samePixel(pixel(500, 93), neighbour), 'Connection endpoint was dimmed');
            checkFade(await sampleFade(() => mouse('mouseout', 300, 90), 100, 263), 1, 'Connection fade-out');
            check(canvas.toDataURL() === normal, 'Leaving the canvas did not clear connection focus');

            checkFade(await sampleFade(() => mouse('mousemove', 100, 90), 100, 263), -1, 'Node fade-in');
            checkDimmed(100, 263, unrelatedNode, 'Node hover did not dim unrelated nodes');
            checkDimmed(300, 260, unrelatedEdge, 'Node hover did not dim unrelated connections');
            check(samePixel(pixel(500, 93), neighbour), 'Node neighbour was dimmed');
            check(samePixel(pixel(300, 90), relatedEdge), 'Node connection was dimmed');
            for (const [x, y] of [[107, 90], [104, 96], [106, 94], [100, 90]]) {
                mouse('mousemove', x, y);
                await delay(120);
                check(p.getVertex(0).focused && !p.getVertex(2).focused, 'Small movements at a node edge lost focus');
                checkDimmed(100, 263, unrelatedNode, 'Node boundary movement flashed unrelated items');
            }
            checkFade(await sampleFade(() => mouse('mousemove', 1, 1), 100, 263), 1, 'Node fade-out');
            check(canvas.toDataURL() === normal, 'Leaving a node did not restore the original image');

            // A brief pass should respond promptly without jumping to full dimming.
            mouse('mousemove', 300, 90);
            await delay(35);
            const flyoverBrightness = brightness(pixel(100, 263));
            check(flyoverBrightness > brightness(unrelatedNode) * 0.5 && flyoverBrightness < brightness(unrelatedNode), 'A brief flyover did not begin a gentle fade');
            mouse('mousemove', 1, 1);
            await idle();
            check(canvas.toDataURL() === normal, 'A brief flyover left hover styling behind');
            check(!p.getVertex(0).focused, 'A brief flyover kept a connection focused');

            // Changing connections should crossfade without brightening everything in between.
            mouse('mousemove', 300, 90);
            await idle();
            const thirdPair = brightness(pixel(700, 403));
            const switchSamples = await sampleFade(() => mouse('mousemove', 300, 260), 700, 403);
            check(switchSamples.samples.every(value => Math.abs(value - thirdPair) <= 2), 'Switching connections flashed unrelated items');
            check(p.getVertex(2).focused && p.getVertex(3).focused && !p.getVertex(0).focused, 'Connection focus did not follow the pointer');
            mouse('mouseout', 300, 260);
            await idle();

            // Reverse direction before a fade finishes and inspect every rendered frame.
            const draw = p.draw;
            const reversalSamples = [];
            p.draw = function () {
                draw();
                reversalSamples.push(brightness(pixel(100, 263)));
            };
            try {
                mouse('mousemove', 100, 90);
                await delay(50);
                mouse('mouseout', 100, 90);
                await delay(30);
                mouse('mousemove', 100, 90);
                await delay(50);
                mouse('mouseout', 100, 90);
                await idle();
            } finally {
                p.draw = draw;
            }
            const normalBrightness = brightness(unrelatedNode);
            check(new Set(reversalSamples).size >= 5, 'Rapid hover reversal did not fade');
            check(reversalSamples.every((value, i) => i === 0 || Math.abs(value - reversalSamples[i - 1]) < normalBrightness * 0.35), 'Reversing a fade caused an abrupt opacity jump');
            check(canvas.toDataURL() === normal, 'Rapid hover reversal did not restore the original image');

            // A connection passing behind a node must not steal its hover.
            await wakes(() => { place(2, 50, 90); place(3, 600, 90); p.loop(); });
            await idle();
            const crossingEdge = pixel(580, 90);
            await wakes(() => mouse('mousemove', 100, 90));
            await idle();
            check(p.getVertex(0).focused && p.getVertex(1).focused && !p.getVertex(2).focused && !p.getVertex(3).focused, 'Node did not take priority over the connection beneath it');
            checkDimmed(580, 90, crossingEdge, 'Connection beneath a hovered node was not dimmed');
            await wakes(() => mouse('mouseout', 100, 90));
            await idle();

            // At a line crossing, focus one connection rather than the whole intersection.
            await wakes(() => {
                [[100, 100], [500, 400], [100, 400], [500, 100]].forEach(([x, y], i) => place(i, x, y));
                p.loop();
            });
            await idle();
            await wakes(() => mouse('mousemove', 300, 250));
            await idle();
            check(Array.from({length: 6}, (_, i) => p.getVertex(i)).filter(v => v.focused).length === 2, 'A line crossing focused more than one connection');
            const crossingFocus = Array.from({length: 6}, (_, i) => p.getVertex(i).focused);
            for (const [x, y] of [[302, 248], [298, 252], [302, 252], [298, 248], [300, 250]]) {
                mouse('mousemove', x, y);
                await delay(120);
                check(crossingFocus.every((focused, i) => p.getVertex(i).focused === focused), 'Small movements at a crossing switched connections');
            }
            await wakes(() => mouse('mouseout', 300, 250));
            await idle();
            passed((view === 0 ? 'People' : 'Shows') + ': hover responds promptly, fades smoothly, preserves neighbours, stays steady at crossings, and clears on exit');
        }
        app.UsedData = savedData;
        p.setViewMode(1);
        p.resetData();
        p.createGraph();
        p.changeLayoutMode(4);
        mouse('mousemove', 1, 1);
        await idle();

        // Follow a real connection to exercise both directions of its hover animation.
        const edge = Array.from({length: p.getVertexCount()}, (_, i) => p.getVertex(i))
            .flatMap(v => v.edge.slice(0, v.numberOfEdges))
            .find(e => Math.hypot(e.vertexA.x - e.vertexB.x, e.vertexA.y - e.vertexB.y) > 150);
        check(edge, 'No connection available for the hover test');
        const image = canvas.toDataURL();
        const beforeHover = p.frameCount;
        await wakes(() => mouse('mousemove', (edge.vertexA.x + edge.vertexB.x) / 2, (edge.vertexA.y + edge.vertexB.y) / 2));
        await idle();
        check(p.frameCount >= beforeHover + 5, 'Hover expansion stopped too early');
        check(canvas.toDataURL() !== image, 'Hover was not rendered');
        await wakes(() => mouse('mousemove', 1, 1));
        await idle();
        check(canvas.toDataURL() === image, 'Hover exit did not restore the original image');
        passed('Edge hover expands, contracts, and returns to idle');

        // Moving with a button held still updates hover when no node was selected.
        mouse('mousedown', 1, 1);
        await idle();
        await wakes(() => mouse('mousemove', (edge.vertexA.x + edge.vertexB.x) / 2, (edge.vertexA.y + edge.vertexB.y) / 2));
        await idle();
        check(canvas.toDataURL() !== image, 'Hover with a mouse button held was not rendered');
        await wakes(() => {
            mouse('mousemove', 1, 1);
            mouse('mouseup', 1, 1);
        });
        await idle();
        check(canvas.toDataURL() === image, 'Button-held hover exit did not restore the original image');
        passed('Hover updates while a mouse button is held over empty space');

        click('viewModePeople');
        const name = app.Data.person[0].name;
        await wakes(() => filter(name));
        await idle();
        check(p.getVertexCount() === 1, 'Include filter failed');
        await wakes(() => click('filterModeExclude'));
        await idle();
        check(p.getVertexCount() === app.Data.person.length - 1, 'Exclude filter failed');
        await wakes(() => click('filterModeInclude'));
        await idle();
        passed('Include and exclude filters wake the graph');

        const vertex = p.getVertex(0);
        const targetX = Math.floor(vertex.x + 35);
        const targetY = Math.floor(vertex.y + 30);
        await wakes(() => {
            mouse('mousemove', vertex.x, vertex.y);
            mouse('mousedown', vertex.x, vertex.y);
            mouse('mousemove', targetX, targetY);
            mouse('mouseup', targetX, targetY);
        });
        await idle();
        check(Math.abs(vertex.x - targetX) <= 1 && Math.abs(vertex.y - targetY) <= 1 && vertex.p.isFree(), 'Dragging failed');
        passed('Dragging a settled node redraws and releases it');

        await wakes(() => { frame.style.width = '900px'; frame.style.height = '650px'; });
        await idle();
        check(p.width === doc.getElementById('visualisation').clientWidth && finiteGraph(), 'Resize failed');
        passed('Resizing wakes the graph and preserves finite positions');

        filter('');
        await wakes(() => click('arrangementPhysics'));
        const physicsFrames = p.frameCount;
        await delay(200);
        check(p.frameCount > physicsFrames && finiteGraph(), 'Physics stopped drawing');
        app.dispatchEvent(new app.Event('blur'));
        const blurredFrames = p.frameCount;
        await delay(150);
        check(p.frameCount === blurredFrames, 'Background physics did not pause');
        await wakes(() => app.dispatchEvent(new app.Event('focus')));
        passed('Physics keeps drawing, pauses on blur, and resumes on focus');

        await wakes(() => filter('no-matching-person-12345'));
        await idle();
        check(p.getVertexCount() === 0, 'Empty filter failed');
        await wakes(() => filter(''));
        check(p.getVertexCount() === app.Data.person.length, 'Clearing the filter failed');
        await wakes(() => click('arrangementRandom'));
        await idle();
        passed('Empty results stop drawing and clearing the filter wakes them');

        const toolbar = doc.getElementById('toolbar');
        const content = doc.getElementById('content');
        const graph = doc.getElementById('visualisation');
        const controls = Array.from(toolbar.querySelectorAll('.ui-button, #filterText'));
        const contains = (outer, inner) => inner.left >= outer.left - 1 && inner.right <= outer.right + 1 &&
            inner.top >= outer.top - 1 && inner.bottom <= outer.bottom + 1;
        for (const [width, height] of [[1600, 900], [1280, 720], [1024, 768], [820, 1180], [768, 1024],
            [601, 800], [600, 800], [390, 844], [320, 640], [844, 390], [568, 320]]) {
            frame.style.width = width + 'px';
            frame.style.height = height + 'px';
            await until(() => app.innerWidth === width && app.innerHeight === height &&
                p.width === graph.clientWidth && p.height === graph.clientHeight, 'Graph did not resize with the controls');
            const size = width + 'x' + height;
            const bounds = toolbar.getBoundingClientRect();
            check(doc.documentElement.scrollWidth <= width && content.scrollWidth <= content.clientWidth, size + ': horizontal overflow');
            check(doc.documentElement.scrollHeight <= height, size + ': outer page overflow');
            const boxes = controls.map(control => control.getBoundingClientRect());
            controls.forEach((control, i) => {
                check(contains(bounds, boxes[i]), size + ': control escaped the toolbar');
                check(boxes[i].width > 0 && boxes[i].height >= (width <= 600 ? 44 : 30), size + ': control is too small');
                if (control.classList.contains('ui-button')) {
                    const text = doc.createRange();
                    text.selectNodeContents(control.querySelector('.ui-button-text'));
                    check(contains(boxes[i], text.getBoundingClientRect()), size + ': button text is clipped');
                }
                for (let j = i + 1; j < boxes.length; j++) {
                    const overlapX = Math.min(boxes[i].right, boxes[j].right) - Math.max(boxes[i].left, boxes[j].left);
                    const overlapY = Math.min(boxes[i].bottom, boxes[j].bottom) - Math.max(boxes[i].top, boxes[j].top);
                    check(overlapX <= 1.1 || overlapY <= 1.1, size + ': controls overlap');
                }
            });
            toolbar.querySelectorAll('.toolbar-group').forEach(group => {
                const groupBox = group.getBoundingClientRect();
                check(contains(groupBox, group.querySelector('.toolbar-title').getBoundingClientRect()), size + ': detached group title');
                group.querySelectorAll('.ui-button, #filterText').forEach(control =>
                    check(contains(groupBox, control.getBoundingClientRect()), size + ': control escaped its group'));
            });
            if (width >= 1280) check(bounds.height <= 44, size + ': desktop toolbar is no longer one row');
            check(graph.clientHeight >= 250 && finiteGraph(), size + ': graph lost usable space or positions');
        }
        doc.getElementById('filterTitle').click();
        check(doc.activeElement === doc.getElementById('filterText'), 'Filter label did not focus the input');
        passed('Controls fit from 320px to 1600px, keep their labels, and resize the graph in portrait and landscape');
        check(errors.length === 0, errors.join('\n'));
        result.textContent = 'All browser checks passed.';
        document.body.dataset.status = 'passed';
    } catch (error) {
        if (p) p.noLoop();
        result.textContent = 'Browser checks failed: ' + error.message;
        document.body.dataset.status = 'failed';
        console.error(error);
    }
});
</script>
</html>
